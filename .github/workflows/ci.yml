name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  server:
    runs-on: ubuntu-latest
    services:
      # Matches server/.env.test exactly -- tests/env.ts loads that file with
      # dotenv's override:true, so it always wins over any env: set here.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together-dev-password
          POSTGRES_DB: together_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
